<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理台 - IM-Agent Gateway 控制台</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

<header class="topbar">
  <div class="logo" data-i18n="IM-Agent Gateway 控制台||IM-Agent Gateway Console">IM-Agent Gateway 控制台</div>
  <nav>
    <a href="index.html" class="current" data-i18n="管理台||Admin">管理台</a>
    <a href="chat.html" data-i18n="聊天台||Chat">聊天台</a>
  </nav>
  <div class="spacer"></div>
  <button id="restart-btn" type="button" class="btn ghost small" data-i18n="重启服务||Restart">重启服务</button>
  <button id="lang-btn" type="button" class="lang-btn" title="Switch language">EN</button>
  <span id="state-badge" class="badge hidden">检测中</span>
</header>

<!-- 睡眠 / 离线遮罩面板 -->
<div id="overlay" class="overlay hidden">
  <div class="panel">
    <h1 id="overlay-title">服务正在休息</h1>
    <p id="overlay-text">服务暂时没有在运行，你可以把它叫醒。</p>
    <button id="wake-btn" class="btn big" data-i18n="点击唤醒||Wake up">点击唤醒</button>
    <p id="overlay-tip" class="overlay-tip hidden" data-i18n="正在尝试叫醒服务，请稍等…||Waking the service, please wait…">正在尝试叫醒服务，请稍等…</p>
  </div>
</div>

<main class="main">

  <!-- 页签导航：概览 / 配置 / 运行日志（日志放最后，属于排查时才看的内容） -->
  <nav class="tabs" role="tablist">
    <button class="tab current" data-tab="overview" role="tab" data-i18n="概览||Overview">概览</button>
    <button class="tab" data-tab="config" role="tab" data-i18n="配置||Settings">配置</button>
    <button class="tab" data-tab="logs" role="tab" data-i18n="运行日志||Logs">运行日志</button>
  </nav>

  <!-- 概览页签：运行状态 + 智能体 + 任务 -->
  <div class="tab-panel" data-panel="overview">
    <!-- 运行状态 -->
    <section class="card">
      <h2 data-i18n="运行状态||Status">运行状态</h2>
      <div id="status-body">
        <p class="empty-note" data-i18n="正在获取…||Loading…">正在获取…</p>
      </div>
    </section>

    <!-- Agent 服务开关 -->
    <section class="card">
      <h2><span data-i18n="智能体服务||Agents">智能体服务</span> <span id="agent-count" class="count"></span></h2>
      <div id="agent-list"></div>
    </section>

    <!-- 任务 -->
    <section class="card">
      <h2><span data-i18n="任务||Tasks">任务</span> <span id="task-count" class="count"></span></h2>
      <div id="task-list" class="task-list"><p class="empty-note" data-i18n="正在获取…||Loading…">正在获取…</p></div>
    </section>
  </div>

  <!-- 配置页签：左侧分组导航 + 右侧清单（搜索、筛选、行内编辑） -->
  <div class="tab-panel hidden" data-panel="config">
    <aside class="config-rail" aria-label="配置分组导航">
      <p class="rail-title" data-i18n="配置分组||Groups">配置分组</p>
      <nav id="config-nav" class="rail-nav"></nav>
      <p id="config-rail-summary" class="rail-summary"></p>
    </aside>

    <section class="card config-card">
      <div class="config-head">
        <h2 data-i18n="配置||Settings">配置</h2>
        <p class="config-sub" data-i18n="保存后写回本机 .env；只有真的改了某项、且该项需要重启时，才会在行内标出。||Saved to the local .env file; only changed items that need a restart are flagged inline.">保存后写回本机 .env；只有真的改了某项、且该项需要重启时，才会在行内标出。</p>
      </div>

      <div class="config-toolbar">
        <label class="config-search">
          <input id="config-search" type="search" placeholder="搜索名称、说明、键名或当前值"
                 data-i18n="搜索名称、说明、键名或当前值||Search name, description, key or value"
                 data-i18n-attr="placeholder"
                 autocomplete="off" spellcheck="false">
        </label>
        <div id="config-filters" class="config-filters" role="group" aria-label="按类型筛选">
          <button type="button" class="chip current" data-filter="all" data-i18n="全部||All">全部</button>
          <button type="button" class="chip" data-filter="hot" data-i18n="即时生效||Live">即时生效</button>
          <button type="button" class="chip" data-filter="cold" data-i18n="重启后生效||On restart">重启后生效</button>
          <button type="button" class="chip" data-filter="bool" data-i18n="开关项||Toggles">开关项</button>
        </div>
        <p id="config-count" class="config-count"></p>
      </div>

      <div id="config-list"></div>

      <div id="config-empty" class="config-empty hidden">
        <p data-i18n="没有找到匹配的配置||No matching settings">没有找到匹配的配置</p>
        <button type="button" id="config-clear" class="btn ghost small" data-i18n="清空筛选||Clear filters">清空筛选</button>
      </div>
    </section>
  </div>

  <!-- 运行日志页签：工具栏（过滤 / 行数 / 自动刷新 / 复制 / 刷新）+ 带行号的日志 -->
  <div class="tab-panel hidden" data-panel="logs">
    <section class="card log-card">
      <div class="log-head">
        <h2><span data-i18n="运行日志||Logs">运行日志</span> <span id="log-meta" class="count"></span></h2>
        <div class="log-tools">
          <label class="log-search">
            <input id="log-filter" type="search" placeholder="过滤关键字"
                   data-i18n="过滤关键字||Filter keyword" data-i18n-attr="placeholder"
                   autocomplete="off" spellcheck="false">
          </label>
          <label class="log-picker">
            <span data-i18n="行数||Lines">行数</span>
            <select id="log-lines">
              <option value="200">200</option>
              <option value="500">500</option>
              <option value="1000">1000</option>
            </select>
          </label>
          <button type="button" id="log-auto" class="chip current" data-i18n="自动刷新||Auto refresh">自动刷新</button>
          <button type="button" id="log-copy" class="btn ghost small" data-i18n="复制||Copy">复制</button>
          <button type="button" id="log-refresh" class="btn ghost small" data-i18n="刷新||Refresh">刷新</button>
        </div>
      </div>
      <div id="log-body" class="log-pre"><p class="empty-note" data-i18n="还没有日志内容||No logs yet">还没有日志内容</p></div>
      <p id="log-empty" class="log-empty hidden" data-i18n="没有匹配的日志行||No matching log lines">没有匹配的日志行</p>
    </section>
  </div>

</main>

<!-- 保存成功提示（全局 toast） -->
<div id="toast" class="toast hidden"></div>

<script type="module">
  // 管理台页面逻辑：三态探测（在线 / 睡眠 / 离线）+ 各区块渲染 + 轮询刷新
  import {
    detectState, getStatus, getAgents, setAgentActive,
    getTasks, getLogs, getConfig, setConfig, wakeService, restartService,
  } from './js/api.js';
  import { applyI18n, getLang, initLang, onLangChange, setLang, t } from './js/i18n.js';

  const $ = (sel) => document.querySelector(sel);

  const stateBadge = $('#state-badge');
  const overlay = $('#overlay');
  const overlayTitle = $('#overlay-title');
  const overlayText = $('#overlay-text');
  const wakeBtn = $('#wake-btn');
  const overlayTip = $('#overlay-tip');
  const langBtn = $('#lang-btn');
  const restartBtn = $('#restart-btn');

  // ---------- 语言切换 ----------
  // 按钮显示的是「点一下会切到的语言」：中文界面显示 EN，英文界面显示 中
  function updateLangBtn() {
    langBtn.textContent = getLang() === 'en' ? '中' : 'EN';
  }

  function renderPageTitle() {
    document.title = t('管理台 - IM-Agent Gateway 控制台', 'Admin - IM-Agent Gateway Console');
  }

  // 切换语言：即时重渲染本页，并写回 LANGUAGE 让 IM 侧回复跟随（离线时忽略失败）
  async function switchLanguage(next) {
    setLang(next);
    updateLangBtn();
    try {
      await setConfig('LANGUAGE', next);
    } catch (_) { /* 睡眠/离线状态下无法写回，仅本页生效 */ }
  }

  langBtn.addEventListener('click', () => switchLanguage(getLang() === 'en' ? 'zh' : 'en'));
  updateLangBtn();
  applyI18n();
  renderPageTitle();
  stateBadge.textContent = t('检测中', 'Checking');

  // ---------- 重启服务 ----------
  // 后端会退出当前实例，并由独立进程在端口释放后拉起新实例；
  // 这里轮询探测到新实例在线后整页刷新（令牌随重启更换，刷新最省事）
  restartBtn.addEventListener('click', async () => {
    const ask = t('确定重启服务？重启期间约有几秒无法访问页面。',
                  'Restart the service? The page will be unreachable for a few seconds.');
    if (!confirm(ask)) return;
    restartBtn.disabled = true;
    restartBtn.textContent = t('重启中…', 'Restarting…');
    try {
      await restartService();
    } catch (_) { /* 请求可能随旧实例退出而中断，继续等待新实例上线 */ }
    // 先等旧实例真正下线，否则立刻探测会命中它，误判重启完成
    const offlineBy = Date.now() + 20000;
    while (Date.now() < offlineBy && await detectState() === 'online') {
      await new Promise((resolve) => setTimeout(resolve, 500));
    }
    const onlineBy = Date.now() + 50000;
    while (Date.now() < onlineBy) {
      await new Promise((resolve) => setTimeout(resolve, 1500));
      if (await detectState() === 'online') {
        location.reload();
        return;
      }
    }
    restartBtn.disabled = false;
    applyI18n();
    alert(t('重启超时，请从桌面快捷方式或托盘菜单重新启动服务。',
            'Restart timed out; start the service again from the desktop shortcut or tray menu.'));
  });

  // 语言变化：静态文案已由监听器统一重设，动态区块清指纹后重绘
  onLangChange(() => {
    applyI18n();
    renderPageTitle();
    setBadge(badgeState);
    // 自动刷新按钮的文案随状态变化，静态文案重置后需按当前状态补一次
    $('#log-auto').textContent = logAuto ? t('自动刷新', 'Auto refresh') : t('已暂停', 'Paused');
    lastStatusSig = lastAgentsSig = lastTasksSig = lastLogsSig = lastConfigSig = '';
    refreshAll().catch(() => {});
  });

  // ---------- 页签切换 ----------
  // 当前激活的页签：overview=概览，logs=运行日志，config=配置
  let currentTab = 'overview';
  // 各页签对应的渲染函数列表：轮询时只刷新当前可见页签，避免不必要的接口请求
  const TAB_RENDERERS = {
    overview: [renderStatus, renderAgents, renderTasks],
    logs: [renderLogs],
    config: [renderConfig],
  };

  function switchTab(name) {
    if (name === currentTab) return;
    currentTab = name;
    // 首屏入场动画已播完：之后切页签不再重播弹入，避免内容先在下方再回位
    document.body.classList.add('ready');
    // 切换页签按钮高亮
    document.querySelectorAll('.tab').forEach((t) =>
      t.classList.toggle('current', t.dataset.tab === name));
    // 切换面板显示
    document.querySelectorAll('.tab-panel').forEach((p) =>
      p.classList.toggle('hidden', p.dataset.panel !== name));
    // 切到目标页签时立即拉取一次最新数据
    const renders = TAB_RENDERERS[name] || [];
    for (const job of renders) {
      try { job().catch(() => {}); } catch (_) {}
    }
  }

  document.querySelectorAll('.tab').forEach((t) => {
    t.addEventListener('click', () => switchTab(t.dataset.tab));
  });

  // ---------- 三态控制 ----------

  // 当前展示的状态（语言切换后按它重写徽章文案）
  let badgeState = 'checking';

  function setBadge(state) {
    badgeState = state;
    stateBadge.classList.remove('hidden', 'offline', 'sleep');
    if (state === 'online') {
      stateBadge.textContent = t('运行中', 'Running');
    } else if (state === 'sleeping') {
      stateBadge.textContent = t('睡眠中', 'Sleeping');
      stateBadge.classList.add('sleep');
    } else if (state === 'offline') {
      stateBadge.textContent = t('未运行', 'Stopped');
      stateBadge.classList.add('offline');
    } else if (state === 'checking') {
      stateBadge.textContent = t('检测中', 'Checking');
    } else {
      stateBadge.textContent = state; // 提示文案等其他状态
    }
  }

  function showSleeping() {
    setBadge('sleeping');
    overlayTitle.textContent = t('服务正在休息', 'Service is sleeping');
    overlayText.textContent = t('服务暂时没有在运行，你可以把它叫醒。',
      'The service is not running right now; you can wake it up.');
    wakeBtn.classList.remove('hidden');
    overlayTip.classList.add('hidden');
    overlay.classList.remove('hidden');
  }

  function showOffline() {
    setBadge('offline');
    overlayTitle.textContent = t('服务没有启动', 'Service is not running');
    overlayText.textContent = t(
      '既没有查到运行中的服务，也没有找到后台待命程序。请先在电脑上启动服务，再刷新本页。',
      'No running service or watchdog was found. Start the service on the computer, then reload this page.');
    wakeBtn.classList.add('hidden');
    overlay.classList.remove('hidden');
  }

  async function handleState() {
    const state = await detectState();
    if (state === 'online') {
      overlay.classList.add('hidden');
      setBadge('online');
      await refreshAll();
    } else if (state === 'sleeping') {
      showSleeping();
    } else {
      showOffline();
    }
  }

  // 唤醒：点击后打 /api/wake，随后轮询等服务上线（最多 60 秒）
  wakeBtn.addEventListener('click', async () => {
    wakeBtn.disabled = true;
    wakeBtn.textContent = t('正在叫醒…', 'Waking…');
    overlayTip.classList.remove('hidden');
    try {
      await wakeService();
    } catch (_) { /* 看门狗可能在服务接管端口瞬间断开，继续轮询即可 */ }
    const deadline = Date.now() + 60 * 1000;
    const poll = setInterval(async () => {
      try {
        await getStatus();
        clearInterval(poll);
        wakeBtn.disabled = false;
        wakeBtn.textContent = t('点击唤醒', 'Wake up');
        await handleState();
      } catch (_) {
        if (Date.now() > deadline) {
          clearInterval(poll);
          wakeBtn.disabled = false;
          wakeBtn.textContent = t('点击唤醒', 'Wake up');
          overlayText.textContent = t(
            '叫醒服务超过了 60 秒还没成功，请到电脑上检查服务进程。',
            'Waking the service timed out after 60 seconds; check the service process on the computer.');
        }
      }
    }, 1500);
  });

  // ---------- 区块渲染 ----------

  // 渲染数据指纹：数据未变化时跳过 DOM 重建，避免轮询触发入场动画反复重放（页面闪烁）
  const dataHash = (x) => { try { return JSON.stringify(x); } catch { return String(x); } };
  let lastStatusSig = '', lastAgentsSig = '', lastTasksSig = '', lastLogsSig = '', lastConfigSig = '';

  // 空闲自动休息提示：只在开启自动休息时出现，不常驻占版面
  function idleNote(row) {
    const idle = row.idle;
    if (!idle || !idle.exit_enabled) return '';
    const remain = Math.max(0, idle.idle_min * 60 - idle.idle_sec);
    const min = Math.floor(remain / 60);
    const text = min >= 1
      ? t(`大约 ${min} 分钟后自动休息`, `Auto-rest in about ${min} min`)
      : t('即将自动休息（收到新消息会重新计时）',
          'Resting soon (a new message restarts the timer)');
    return `<p class="idle-note"><span class="idle-dot"></span>${text}</p>`;
  }

  // 托盘异常提示：Windows 下缺依赖时右下角不会出现图标，这里给出原因而不是静默失效
  function trayProblem(st) {
    const tr = st.tray || {};
    if (!tr.supported || tr.running) return '';
    const reason = tr.error || t('托盘图标未启动，详见日志', 'Tray icon not started; see logs');
    return `<p class="idle-note warn">${t('托盘图标', 'Tray icon')}：${esc(reason)}</p>`;
  }

  // 运行状态：三块指标先给结论，再用通道徽章给出细节
  async function renderStatus() {
    const st = await getStatus();
    const sig = dataHash(st);
    if (sig === lastStatusSig) return;
    lastStatusSig = sig;
    const online = st.channels.filter((c) => c.connected).length;
    const channelHtml = st.channels.length
      ? `<div class="channel-list">${st.channels.map((c) => `
            <span class="chan ${c.connected ? 'on' : 'off'}">
              <span class="chan-name">${esc(c.name)}</span>
              <span class="chan-state">${c.connected ? t('已连接', 'connected') : t('未连接', 'disconnected')}</span>
            </span>`).join('')}</div>`
      : `<p class="empty-note">${t('还没有接入消息通道', 'No message channel connected yet')}</p>`;
    $('#status-body').innerHTML = `
      <div class="metric-row">
        <div class="metric">
          <span class="metric-label">${t('运行状态', 'Status')}</span>
          <span class="metric-value ok"><span class="live-dot"></span>${t('正常运行', 'Running')}</span>
        </div>
        <div class="metric">
          <span class="metric-label">${t('消息通道', 'Channels')}</span>
          <span class="metric-value">${online}<span class="metric-sub"> / ${st.channels.length} ${t('已连接', 'connected')}</span></span>
        </div>
        <div class="metric">
          <span class="metric-label">${t('智能体', 'Agents')}</span>
          <span class="metric-value">${st.agents.active}<span class="metric-sub"> / ${st.agents.total} ${t('已开启', 'enabled')}</span></span>
        </div>
      </div>
      ${channelHtml}
      ${trayProblem(st)}
      ${idleNote(st)}`;
  }

  async function renderAgents() {
    const agents = await getAgents();
    const sig = dataHash(agents);
    if (sig === lastAgentsSig) return;
    lastAgentsSig = sig;
    $('#agent-count').textContent =
      `${agents.filter((a) => a.active).length} / ${agents.length} ${t('已开启', 'enabled')}`;
    const host = $('#agent-list');
    host.innerHTML = '';
    if (!agents.length) {
      host.innerHTML = `<p class="empty-note">${t('还没有接入任何智能体', 'No agent connected yet')}</p>`;
      return;
    }
    // 用途与档位的通俗展示名（与后端 kind / complexity 配置对应）
    const KIND_CN = {
      chat: t('对话', 'Chat'), coding: t('编码', 'Coding'), office: t('办公', 'Office'),
    };
    const LEVEL_CN = {
      simple: t('简单', 'Simple'), mid: t('中等', 'Medium'), complex: t('复杂', 'Complex'),
    };
    agents.forEach((a) => {
      const row = document.createElement('div');
      row.className = 'agent-row';
      const disabled = a.active && !a.available;
      const kind = KIND_CN[a.kind] || a.kind || t('未设置', 'Not set');
      const level = a.complexity ? (LEVEL_CN[a.complexity] || a.complexity) : '';
      // 接入契约里的 label 自带用途括注（如「Trae（编码）」/「Trae (Coding)」），与用途标签重复，展示时去掉
      const name = a.label.replace(/（[^）]*）\s*$|\([^)]*\)\s*$/, '').trim() || a.label;
      // 用途与档位改成名称后的标签，扫一眼就能对比，不再占一行说明
      row.innerHTML = `
        <span class="agent-avatar" data-kind="${esc(a.kind || '')}" aria-hidden="true">${esc(name.slice(0, 1))}</span>
        <div class="info">
          <div class="name">
            ${esc(name)}
            <span class="tag">${esc(kind)}</span>
            ${level ? `<span class="tag muted">${esc(level)}</span>` : ''}
          </div>
          <div class="desc">${esc(a.routing_hint)}</div>
          ${!a.available ? `<div class="state-note">${t('暂不可用：缺少配置或未安装', 'Unavailable: missing configuration or not installed')}</div>` : ''}
        </div>
        <button class="toggle ${a.active ? 'on' : ''}" ${disabled ? 'disabled' : ''}
                title="${a.active ? t('点击关闭', 'Click to turn off') : t('点击开启', 'Click to turn on')}">
          <span class="knob"></span>
        </button>`;
      const toggle = row.querySelector('.toggle');
      toggle.addEventListener('click', async () => {
        toggle.disabled = true;
        try {
          const res = await setAgentActive(a.name, !a.active);
          if (!res.ok) {
            alert(res.error || t('操作没有成功，请稍后再试', 'The operation failed, please try again later'));
          }
          await renderAgents();
          await renderStatus();
        } catch (_) {
          alert(t('连接服务失败，请稍后再试', 'Could not reach the service, please try again later'));
          toggle.disabled = false;
        }
      });
      host.appendChild(row);
    });
  }

  async function renderTasks() {
    const data = await getTasks();
    const sig = dataHash(data);
    if (sig === lastTasksSig) return;
    lastTasksSig = sig;
    $('#task-count').textContent = t(`${data.inflight} 个进行中`, `${data.inflight} running`);
    const host = $('#task-list');
    if (!data.recent.length) {
      host.innerHTML = `<p class="empty-note">${t('最近还没有任务记录，这里只保留本次运行期间的任务',
        'No tasks yet; only tasks from this run are kept here')}</p>`;
      return;
    }
    // 任务行：状态、任务名、来源与耗时等信息各占一列，左对齐扫读、右侧补细节
    host.innerHTML = data.recent.map((task) => {
      const meta = [task.im, task.model, t(`${task.elapsed_sec} 秒`, `${task.elapsed_sec} s`), task.usage]
        .filter(Boolean).map(esc).join(' · ');
      return `
        <div class="task-item">
          <span class="task-state ${task.ok ? 'ok' : 'fail'}">${task.ok ? t('完成', 'done') : t('失败', 'failed')}</span>
          <span class="task-label" title="${esc(task.label)}">${esc(task.label)}</span>

  // ---------- 运行日志（行号、级别着色、关键字过滤、自动刷新） ----------

  // 日志视图状态：拉取行数、过滤关键字、是否跟随自动刷新
  let logLines = 200;

  let logAuto = true;
  let logRaw = [];

  // 按级别给日志行着色：错误优先，其次警告与调试
  function logLevel(line) {
    if (/(^|\s)(ERROR|CRITICAL|FATAL)(\s|:)/.test(line)) return 'error';
    if (/(^|\s)(WARNING|WARN)(\s|:)/.test(line)) return 'warn';
    if (/(^|\s)(DEBUG)(\s|:)/.test(line)) return 'debug';
    return '';
  }

  // 用缓存渲染日志视图：过滤在本地完成，改关键字或行宽不需重新请求
  function renderLogView() {
    const kw = logKeyword.toLowerCase();
    const rows = logRaw
      .map((line, i) => ({ line, no: i + 1 }))
      .filter((r) => !kw || r.line.toLowerCase().includes(kw));
    const body = $('#log-body');
    // 有日志但没有命中：收起深色日志块，只留一行浅色提示，避免出现空的深色条
    const noMatch = logRaw.length > 0 && rows.length === 0;
    body.classList.toggle('hidden', noMatch);
    $('#log-empty').classList.toggle('hidden', !noMatch);
    $('#log-meta').textContent = !logRaw.length
      ? ''
      : (kw ? t(`显示 ${rows.length} / ${logRaw.length} 行`, `Showing ${rows.length} / ${logRaw.length} lines`)
            : t(`最近 ${logRaw.length} 行`, `Latest ${logRaw.length} lines`));
    if (!logRaw.length) {
      body.innerHTML = `<p class="empty-note">${t('还没有日志内容', 'No logs yet')}</p>`;
      return;
    }
    if (noMatch) {
      body.innerHTML = '';
      return;
    }
    // 只有原本就贴着底部时才自动滚到最新，避免打断正在往上翻的阅读
    const nearBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 80;
    body.innerHTML = rows.map((r) => `
      <div class="log-line ${logLevel(r.line)}">
        <span class="log-no">${r.no}</span>
        <span class="log-text">${esc(r.line)}</span>
      </div>`).join('');
    if (nearBottom) body.scrollTop = body.scrollHeight;
  }

  async function renderLogs(force = false) {
    // 暂停自动刷新时，后台轮询不再重绘，避免读到一半被新日志顶走
    if (!logAuto && !force) return;
    const data = await getLogs(logLines);
    const sig = data.lines.join('\n');
    if (!force && sig === lastLogsSig) return;
    lastLogsSig = sig;
    logRaw = data.lines || [];
    renderLogView();
  }

  const CFG_WORKSPACES = new Set(['WORKSPACES']);

  // 解析 `名称=值,名称=值`；空项与无等号的项忽略
  function cfgParseMap(raw) {
    const map = new Map();
    String(raw || '').split(',').forEach((part) => {
      const [name, value] = part.split('=').map((s) => s.trim());
      if (name) map.set(name, value || '');
    });
    return map;
  }

  // 解析工作区的 `名称=路径;名称2=路径2`
  function cfgParseWorkspaces(raw) {
    return String(raw || '').split(';').map((s) => s.trim()).filter(Boolean).map((part) => {
      const idx = part.indexOf('=');
      return idx < 0
        ? { name: part, path: '' }
        : { name: part.slice(0, idx).trim(), path: part.slice(idx + 1).trim() };
    });
  }

  const CFG_KIND_TEXTS = ['聊天', '对话', '编码', '办公', 'Chat', 'Coding', 'Office'];
  const cfgSplitAgentLabel = (agents, name) => {

  const cfgAgentDefault = (agents, name, key) => {

  function cfgHandleSaved(it, value, res) {

  // 当前筛选状态：查询词、类型筛选、高级区是否展开、左侧导航选中项
  let cfgQuery = '';

  // 插值统一转义，配置值里出现的 HTML 字符不进标签层
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({

  function cfgMatches(it) {

    if (cfgFilter === 'cold' && it.hot) return false;

    const hay = `${it.label} ${it.desc} ${it.key} ${cfgShown(it)}`.toLowerCase();

  // 值的展示：空值说「未设置」，敏感项打码，短逗号清单拆成标签，其余单行省略
  function cfgValueHtml(it, agents = []) {

    }
    if (CFG_MULTIS[it.key]) {
      const options = CFG_MULTIS[it.key](agents).slice();
      String(current || '').split(',').map((s) => s.trim()).filter(Boolean).forEach((name) => {

      const picked = new Set(String(current || '').split(',').map((s) => s.trim()).filter(Boolean));

        if (note) {
          return `<label class="cfg-pill locked${on ? ' on' : ''}" title="${esc(note())}">
            <input type="checkbox" value="${esc(value)}"${on ? ' checked' : ''} disabled>
            <span>${esc(label)}</span><em class="cfg-pill-auto">${t('自动', 'Auto')}</em>
          </label>`;
        }
        return `<label class="cfg-pill${on ? ' on' : ''}">
          <input type="checkbox" value="${esc(value)}"${on ? ' checked' : ''}>
          <span>${esc(label)}</span>
        </label>`;
      }).join('')}</div>`;
    }
    return `<select class="cfg-select" data-select>${cfgOptionHtml(
      cfgFillOptions(cfgSelectOptions(it, agents), current), current)}</select>`;
  }

  // 控件事件：任何一次改动都立即写回，失败由提示告知并按后端值回滚
  function cfgWireInline(row, it, agents = []) {
    const control = row.querySelector('.cfg-control');
    if (CFG_AGENT_MAPS[it.key]) {
      control.addEventListener('change', (e) => {
        const sel = e.target.closest('select[data-agent]');
        if (!sel) return;
        // 用途改完立刻同步名称后的括注，不用等保存回包
        if (it.key === 'AGENT_KINDS') {
          const kindEl = sel.closest('.cfg-agentmap-row').querySelector('.cfg-agentmap-kind');
          if (kindEl) {
            // 选「未设置」时回落到 Agent 自带用途，括注仍然有意义
            const kind = sel.value || cfgAgentDefault(agents, sel.dataset.agent, 'AGENT_KINDS');
            const text = kind ? cfgOptionText(CFG_AGENT_MAPS.AGENT_KINDS(), kind) : '';
            kindEl.textContent = text ? `（${text}）` : '';
          }
        }
        // 和 Agent 默认值相同、且原本没写进配置的项不写回，避免把默认值固化成覆写
        const savedMap = cfgParseMap(cfgShown(it));
        const picked = [];
        control.querySelectorAll('select[data-agent]').forEach((el) => {
          const name = el.dataset.agent;
          if (!el.value) return;
          if (el.value === cfgAgentDefault(agents, name, it.key) && !savedMap.has(name)) return;
          picked.push(`${name}=${el.value}`);
        });
        cfgSaveInline(row, it, picked.join(','));
      });
      return;
    }
    if (CFG_MULTIS[it.key]) {
      control.addEventListener('change', (e) => {
        const input = e.target.closest('input[type="checkbox"]');
        if (!input) return;
        input.closest('.cfg-pill').classList.toggle('on', input.checked);
        const value = [...control.querySelectorAll('input[type="checkbox"]:checked')]
          .map((el) => el.value).join(',');
        cfgSaveInline(row, it, value);
      });
      return;
    }
    const sel = control.querySelector('select[data-select]');
    sel.addEventListener('change', () => cfgSaveInline(row, it, sel.value));
  }

  // 改完即保存：保存期间整行控件变淡且不可点，避免连续改动互相覆盖
  async function cfgSaveInline(row, it, value) {
    if (value === cfgShown(it)) return;
    cfgSaving += 1;
    row.classList.add('saving');
    try {
      const res = await setConfig(it.key, value);
      if (!res.ok) {
        alert(res.error || t('保存没有成功，请稍后再试', 'Saving failed, please try again later'));
      } else {
        cfgHandleSaved(it, value, res);
      }
    } catch (_) {
      alert(t('连接服务失败，请稍后再试', 'Could not reach the service, please try again later'));
    } finally {
      cfgSaving -= 1;
      row.classList.remove('saving');
    }
    // 全部保存结束后再重建，落定最终值（失败时也回到后端的真实值）
    if (cfgSaving === 0) {
      lastConfigSig = '';
      renderConfig(true).catch(() => {});
    }
  }

  // 渲染单条配置行；editable=false 为未登记只读行（没有修改入口）
  function cfgRow(it, editable, agents = []) {
    const row = document.createElement('div');
    row.className = 'cfg-row';
    row.dataset.key = it.key;
    const shown = cfgShown(it);
    // 只有本次真的保存了不同的值才标「待重启」；未改动时行内不出现任何重启提示
    const pendTag = cfgPending.has(it.key)
      ? `<span class="pend-badge">${t('待重启', 'Restart to apply')}</span>` : '';
    const head = `
      <div class="cfg-main">
        <div class="cfg-label">
          <span class="cfg-name">${esc(it.label)}</span>${pendTag}
        </div>
        <div class="cfg-desc">${esc(it.desc)}</div>
      </div>`;

    if (editable && it.type === 'bool') {
      // 开关项：文字状态 + 滑块，点击即保存（值写 1 / 0）
      row.innerHTML = `${head}
        <div class="cfg-control">
          <span class="cfg-state">${shown === '1' ? t('已开启', 'On') : t('已关闭', 'Off')}</span>
          <button type="button" class="toggle ${shown === '1' ? 'on' : ''}"
                  title="${shown === '1' ? t('点击关闭', 'Click to turn off') : t('点击开启', 'Click to turn on')}"><span class="knob"></span></button>
        </div>`;
      const btn = row.querySelector('.toggle');
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        const next = shown === '1' ? '0' : '1';
        try {
          const res = await setConfig(it.key, next);
          if (res.ok) {
            // 热生效项直接刷新；冷生效项仅在值确实变化时记入待重启缓存
            if (res.hot) {
              toast(t('已生效', 'Applied'));
            } else if (next !== it.value) {
              cfgPending.set(it.key, next);
              toast(t('已保存，重启服务后生效', 'Saved; takes effect after a restart'));
            } else {
              toast(t('已保存', 'Saved'));
            }
          } else {
            alert(res.error || t('保存没有成功，请稍后再试', 'Saving failed, please try again later'));
          }
        } catch (_) {
          alert(t('连接服务失败，请稍后再试', 'Could not reach the service, please try again later'));
        }
        btn.disabled = false;
        renderConfig(true).catch(() => {});
      });
      return row;
    }

    // 下拉 / 勾选类：直接展示控件，改完即保存（无需先点「修改」）
    if (editable && cfgIsInline(it.key)) {
      // 逐 Agent 下拉会占多行，左侧说明改为顶部对齐
      if (CFG_AGENT_MAPS[it.key]) row.classList.add('cfg-row-top');
      row.innerHTML = `${head}
        <div class="cfg-control cfg-control-inline">${cfgInlineHtml(it, agents)}</div>`;
      cfgWireInline(row, it, agents);
      return row;
    }

    // 文本项：当前值 + 修改按钮（只读行只展示值）
    row.innerHTML = `${head}
      <div class="cfg-control">
        <div class="cfg-value">${cfgValueHtml(it, agents)}</div>
        ${editable ? `<button type="button" class="btn ghost small cfg-edit-btn">${t('修改', 'Edit')}</button>` : ''}
      </div>`;
    if (editable) {
      row.querySelector('.cfg-edit-btn').addEventListener('click', () => cfgStartEdit(row, it, agents));
    }
    return row;
  }

  // 点「修改」：行下方展开通栏编辑区，保存失败时在输入框下方就地显示错误
  function cfgStartEdit(row, it, agents = []) {
    cfgEditKey = it.key;
    row.classList.add('editing');
    const editBtn = row.querySelector('.cfg-edit-btn');
    if (editBtn) editBtn.disabled = true;

    // 按配置类型选择控件：标签 / 工作区 / 数值（滑块 + 输入）/ 文本
    // （下拉与勾选已在行内直接保存，不会走到这里）
    if (CFG_TAGS.has(it.key)) { cfgStartTagsEdit(row, it); return; }
    if (CFG_WORKSPACES.has(it.key)) { cfgStartWorkspacesEdit(row, it); return; }
    if (CFG_NUMBERS[it.key]) { cfgStartNumberEdit(row, it, CFG_NUMBERS[it.key]); return; }
    if (CFG_RANGES[it.key]) { cfgStartNumberEdit(row, it, CFG_RANGES[it.key]); return; }
    cfgStartTextEdit(row, it);
  }

  // 通用编辑区骨架：挂载、错误提示、保存 / 取消；collect 返回要写入的值（null = 直接关闭）
  function cfgMountEditor(row, it, bodyHtml, collect, { enterSaves = false, focus = null } = {}) {
    const box = document.createElement('div');
    box.className = 'cfg-editor';
    box.innerHTML = `${bodyHtml}
      <div class="cfg-editor-actions">
        <button type="button" class="btn small" data-save>${t('保存', 'Save')}</button>
        <button type="button" class="btn ghost small" data-cancel>${t('取消', 'Cancel')}</button>
      </div>
      <p class="cfg-error hidden"></p>`;
    row.appendChild(box);

    const errBox = box.querySelector('.cfg-error');
    const saveBtn = box.querySelector('[data-save]');
    const cancelBtn = box.querySelector('[data-cancel]');
    const showErr = (msg) => {
      errBox.textContent = msg;
      errBox.classList.remove('hidden');
    };
    // 结束编辑：复位状态并强制重建，避免轮询缓存导致编辑框残留
    const done = () => {
      cfgEditKey = null;
      lastConfigSig = '';
      renderConfig(true).catch(() => {});
    };
    const save = async () => {
      let value;
      try {
        value = collect(box);
      } catch (err) {
        showErr(err && err.message ? err.message : t('请检查填写的内容', 'Please check the input'));
        return;
      }
      if (value === null) { done(); return; }
      saveBtn.disabled = true;
      try {
        const res = await setConfig(it.key, value);
        if (!res.ok) {
          showErr(res.error || t('保存没有成功，请稍后再试', 'Saving failed, please try again later'));
          saveBtn.disabled = false;
          return;
        }
        cfgHandleSaved(it, value, res);
      } catch (_) {
        showErr(t('连接服务失败，请稍后再试', 'Could not reach the service, please try again later'));
        saveBtn.disabled = false;
        return;
      }
      done();
    };

    saveBtn.addEventListener('click', save);
    cancelBtn.addEventListener('click', done);
    if (enterSaves) {
      // 数值编辑区第一个 input 是滑块，回车保存要绑到所有输入控件上
      box.querySelectorAll('input').forEach((input) => {
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') { e.preventDefault(); save(); }
          if (e.key === 'Escape') done();
        });
      });
    }
    if (focus) {
      try { focus(box); } catch (_) { /* 聚焦失败不影响编辑 */ }
    }
    return box;
  }

  // 文本 / 密钥：敏感项留空表示保持不变
  function cfgStartTextEdit(row, it) {
    const body = `
      <div class="cfg-editor-field">
        <input type="text" value="${it.sensitive ? '' : esc(cfgShown(it))}"
               placeholder="${it.sensitive ? t('留空保持不变，填写新值则更换', 'Leave blank to keep; enter a new value to replace')
                                           : t('填写新的值', 'Enter a new value')}"
               autocomplete="off" spellcheck="false">
      </div>`;
    cfgMountEditor(row, it, body, (box) => {
      const value = box.querySelector('input').value.trim();
      return it.sensitive && !value ? null : value;
    }, {
      enterSaves: true,
      focus: (box) => {
        const input = box.querySelector('input');
        input.focus();
        if (!it.sensitive) input.select();
      },
    });
  }

  // 标签清单：逐个「添加 / 删除」，不用手写逗号
  function cfgStartTagsEdit(row, it) {
    const tags = String(cfgShown(it) || '').split(',').map((s) => s.trim()).filter(Boolean);
    const body = `
      <div class="cfg-editor-field">
        ${tags.length ? `<div class="cfg-tags">
          ${tags.map((value) => `<span class="cfg-tag-item" data-value="${esc(value)}">
            <span>${esc(value)}</span>
            <button type="button" class="cfg-tag-del" aria-label="${t('删除', 'Remove')}">×</button>
          </span>`).join('')}
        </div>` : ''}
        <div class="cfg-tag-add">
          <input type="text" class="cfg-tag-input"
                 placeholder="${t('输入后点「添加」', 'Type a value, then click Add')}" autocomplete="off">
          <button type="button" class="btn ghost small" data-add>${t('添加', 'Add')}</button>
        </div>
      </div>`;
    const box = cfgMountEditor(row, it, body, (b) =>
      [...b.querySelectorAll('.cfg-tag-item')].map((el) => el.dataset.value).join(','));

    // 空清单时不渲染容器，首次添加时补建，避免空容器多出一段间距
    const tagsBox = () => {
      let list = box.querySelector('.cfg-tags');
      if (!list) {
        list = document.createElement('div');
        list.className = 'cfg-tags';
        box.querySelector('.cfg-editor-field').prepend(list);
      }
      return list;
    };

    const addTag = () => {
      const input = box.querySelector('.cfg-tag-input');
      const value = input.value.trim();
      if (!value) return;
      if ([...box.querySelectorAll('.cfg-tag-item')].some((el) => el.dataset.value === value)) {
        input.value = '';
        return;
      }
      const item = document.createElement('span');
      item.className = 'cfg-tag-item';
      item.dataset.value = value;
      item.innerHTML = `<span>${esc(value)}</span>
        <button type="button" class="cfg-tag-del" aria-label="${t('删除', 'Remove')}">×</button>`;
      tagsBox().appendChild(item);
      input.value = '';
      input.focus();
    };
    box.querySelector('[data-add]').addEventListener('click', addTag);
    box.querySelector('.cfg-tag-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); addTag(); }
    });
    box.querySelector('.cfg-editor-field').addEventListener('click', (e) => {
      const del = e.target.closest('.cfg-tag-del');
      if (del) del.closest('.cfg-tag-item').remove();
    });
    box.querySelector('.cfg-tag-input').focus();
  }

  // 数值：滑块粗调 + 数字框精调，两者联动；保存前做范围校验
  function cfgStartNumberEdit(row, it, conf) {
    const current = cfgShown(it);
    const unit = conf.unit ? conf.unit() : '';
    const withSlider = conf.slider !== false;
    const body = `
      <div class="cfg-editor-field">
        <div class="cfg-number-edit">
          ${withSlider ? `<input type="range" min="${conf.min}" max="${conf.max}"
                 step="${conf.step}" value="${esc(current)}" aria-label="${esc(it.label)}">` : ''}
          <div class="cfg-number">
            <input type="number" value="${esc(current)}" min="${conf.min}" max="${conf.max}"
                   step="${conf.step}" inputmode="decimal">
            ${unit ? `<span class="cfg-unit">${esc(unit)}</span>` : ''}
          </div>
        </div>
      </div>`;
    const box = cfgMountEditor(row, it, body, (b) => {
      const raw = b.querySelector('input[type="number"]').value.trim();
      const num = Number(raw);
      if (!raw || Number.isNaN(num)) throw new Error(t('请填写数字', 'Please enter a number'));
      if (conf.min !== undefined && num < conf.min) {
        throw new Error(t(`不能小于 ${conf.min}`, `Must be at least ${conf.min}`));
      }
      if (conf.max !== undefined && num > conf.max) {
        throw new Error(t(`不能大于 ${conf.max}`, `Must be at most ${conf.max}`));
      }
      return String(num);
    }, { enterSaves: true, focus: (b) => b.querySelector('input[type="number"]').select() });

    const range = box.querySelector('input[type="range"]');
    const number = box.querySelector('input[type="number"]');
    if (range) {
      // 拖滑块实时回填数字框；输入数字则同步滑块位置（超出范围自动夹到两端）
      range.addEventListener('input', () => { number.value = range.value; });
      number.addEventListener('input', () => {
        const num = Number(number.value);
        if (number.value !== '' && !Number.isNaN(num)) range.value = String(num);
      });
    }
  }

  // 命名工作区：逐行填写名称与路径，可新增 / 删除
  function cfgStartWorkspacesEdit(row, it) {
    const rowHtml = (name, path) => `
      <div class="cfg-ws-row">
        <input type="text" data-name placeholder="${t('名称', 'Name')}" value="${esc(name)}">
        <input type="text" data-path placeholder="${t('目录路径', 'Directory path')}" value="${esc(path)}">
        <button type="button" class="btn ghost small" data-del>${t('删除', 'Remove')}</button>
      </div>`;
    const body = `
      <div class="cfg-editor-field">
        <div class="cfg-ws-list">${cfgParseWorkspaces(cfgShown(it))
          .map((w) => rowHtml(w.name, w.path)).join('')}</div>
        <button type="button" class="btn ghost small" data-add-ws>${t('新增工作区', 'Add workspace')}</button>
      </div>`;
    const box = cfgMountEditor(row, it, body, (b) => {
      const parts = [];
      b.querySelectorAll('.cfg-ws-row').forEach((rowEl) => {
        const name = rowEl.querySelector('[data-name]').value.trim();
        const path = rowEl.querySelector('[data-path]').value.trim();
        if (!name && !path) return;
        if (!name || !path) {
          throw new Error(t('工作区名称和路径要成对填写', 'Both name and path are required'));
        }
        if (name.includes('=') || name.includes(';') || path.includes(';')) {
          throw new Error(t('名称和路径不能包含 = 或 ;', 'Name and path cannot contain = or ;'));
        }
        parts.push(`${name}=${path}`);
      });
      return parts.join(';');
    });

    const list = box.querySelector('.cfg-ws-list');
    const bindDel = (rowEl) => rowEl.querySelector('[data-del]')
      .addEventListener('click', () => rowEl.remove());
    list.querySelectorAll('.cfg-ws-row').forEach(bindDel);
    box.querySelector('[data-add-ws]').addEventListener('click', () => {
      const tmp = document.createElement('div');
      tmp.innerHTML = rowHtml('', '');
      const rowEl = tmp.firstElementChild;
      list.appendChild(rowEl);
      bindDel(rowEl);
      rowEl.querySelector('[data-name]').focus();
    });
  }

  // 单个分组区块：标题 + 说明 + 行列表
  function cfgSection(group, items, agents = []) {
    const sec = document.createElement('section');
    sec.className = 'cfg-group';
    sec.id = `cfg-group-${group.id}`;
    const head = document.createElement('div');
    head.className = 'cfg-group-head';
    head.innerHTML = `
      <h3>
        <span>${esc(t(group.title, group.title_en))}</span>
        ${group.advanced ? `<span class="cfg-tag adv">${t('高级', 'Advanced')}</span>` : ''}
        <span class="cfg-group-count">${t(`${items.length} 项`, `${items.length} items`)}</span>
      </h3>
      <p class="cfg-group-desc">${esc(t(group.desc, group.desc_en))}</p>`;
    sec.appendChild(head);
    items.forEach((it) => sec.appendChild(cfgRow(it, true, agents)));
    return sec;
  }

  // 左侧导航：全部 + 常用分组 + 高级分组，数字为各分组内的配置总数
  function renderCfgNav(counts) {
    const btn = (target, label, count) => `
      <button type="button" data-target="${target}"
              class="${target === cfgActiveNav ? 'current' : ''}">
        <span>${esc(label)}</span><span class="count">${count}</span>
      </button>`;
    const parts = [btn('top', t('全部配置', 'All settings'), counts.total)];
    CFG_GROUPS.filter((g) => !g.advanced)
      .forEach((g) => parts.push(btn(g.id, t(g.title, g.title_en), counts.byGroup[g.id] || 0)));
    parts.push(`<p class="rail-label">${t('高级设置', 'Advanced')}</p>`);
    CFG_GROUPS.filter((g) => g.advanced)
      .forEach((g) => parts.push(btn(g.id, t(g.title, g.title_en), counts.byGroup[g.id] || 0)));
    $('#config-nav').innerHTML = parts.join('');
  }

  async function renderConfig(force = false) {
    // 正在编辑或正在保存时不重建列表，防止输入框与选择被轮询刷掉
    if (cfgEditKey !== null || cfgSaving > 0) { return; }
    const cfg = await getConfig();
    // 用途 / 档位与默认智能体的下拉选项来自当前已加载的智能体列表
    const agents = await getAgents().catch(() => []);
    // 服务重启后配置已按新值生效：清掉与当前运行值一致的待重启标记，
    // 避免用户没做任何改动、或改动已经生效时，页面仍提示需要重启
    cfg.common.concat(cfg.advanced).forEach((it) => {
      if (!it.sensitive && cfgPending.has(it.key) && cfgPending.get(it.key) === it.value) {
        cfgPending.delete(it.key);
      }
    });
    // 指纹纳入待重启缓存与筛选状态：值未变、筛选未变时不重建 DOM
    const sig = dataHash(cfg) + '|' + dataHash([...cfgPending.entries()])
      + '|' + dataHash(agents) + '|' + cfgQuery + '|' + cfgFilter;
    if (!force && sig === lastConfigSig) return;
    lastConfigSig = sig;

    // 常用与高级按 key 合并，分组定义里直接按键名取用
    const all = new Map();
    cfg.common.forEach((it) => all.set(it.key, it));
    cfg.advanced.forEach((it) => all.set(it.key, it));
    const counts = { total: all.size, byGroup: {} };
    CFG_GROUPS.forEach((g) => {
      counts.byGroup[g.id] = g.keys.filter((k) => all.has(k)).length;
    });

    const host = $('#config-list');
    host.innerHTML = '';
    let visible = 0;

    // 常用分组
    CFG_GROUPS.filter((g) => !g.advanced).forEach((g) => {
      const items = g.keys.map((k) => all.get(k)).filter(Boolean).filter(cfgMatches);
      if (!items.length) return;
      visible += items.length;
      host.appendChild(cfgSection(g, items, agents));
    });

    // 高级分组收进折叠区；搜索或筛选时自动展开，避免匹配项被藏起来
    const advMatched = cfg.advanced.filter(cfgMatches).length;
    if (cfg.advanced.length && (advMatched > 0 || (!cfgQuery && cfgFilter === 'all'))) {
      const adv = document.createElement('details');
      adv.className = 'cfg-advanced';
      adv.id = 'config-advanced-box';
      adv.open = cfgAdvancedOpen || !!cfgQuery || cfgFilter !== 'all';
      const summary = document.createElement('summary');
      summary.innerHTML = `${t('高级设置', 'Advanced')} <span class="cfg-group-count">${advMatched} / ${cfg.advanced.length} ${t('项', 'items')}</span>`;
      adv.appendChild(summary);
      CFG_GROUPS.filter((g) => g.advanced).forEach((g) => {
        const items = g.keys.map((k) => all.get(k)).filter(Boolean).filter(cfgMatches);
        if (!items.length) return;
        visible += items.length;
        adv.appendChild(cfgSection(g, items, agents));
      });
      adv.addEventListener('toggle', () => {
        // 只有用户主动开合时才记住偏好；筛选引起的展开不覆盖它
        if (!cfgQuery && cfgFilter === 'all') cfgAdvancedOpen = adv.open;
      });
      host.appendChild(adv);
    }

    // 未登记字段：只读展示，仍可被搜索命中
    const unkItems = (cfg.unknown || []).filter(cfgMatches);
    if (unkItems.length && cfgFilter === 'all') {
      const unk = document.createElement('details');
      unk.className = 'cfg-advanced cfg-unknown-box';
      unk.open = !!cfgQuery;
      const summary = document.createElement('summary');
      summary.innerHTML = `${t('未登记配置（只读）', 'Unregistered settings (read-only)')} <span class="cfg-group-count">${t(`${unkItems.length} 项`, `${unkItems.length} items`)}</span>`;
      unk.appendChild(summary);
      unkItems.forEach((it) => unk.appendChild(cfgRow(it, false)));
      host.appendChild(unk);
    }

    // 工具栏计数、左侧汇总与空状态
    const filtering = !!cfgQuery || cfgFilter !== 'all';
    // 没有待重启项时只说总数，不出现「待重启 0 项」这类多余提示
    const pendNote = cfgPending.size
      ? t(` · 待重启 ${cfgPending.size} 项`, ` · ${cfgPending.size} restart pending`)
      : '';
    $('#config-count').textContent = filtering
      ? t(`匹配 ${visible} 项`, `${visible} matched`)
      : t(`共 ${counts.total} 项${pendNote}`, `${counts.total} items${pendNote}`);
    $('#config-rail-summary').textContent =
      t(`常用 ${cfg.common.length} 项 · 高级 ${cfg.advanced.length} 项`,
        `Common ${cfg.common.length} · Advanced ${cfg.advanced.length}`);
    $('#config-empty').classList.toggle('hidden', visible > 0);
    renderCfgNav(counts);
  }

  // 左侧导航点击：滚动到分组；高级分组先展开再滚动
  $('#config-nav').addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-target]');
    if (!btn) return;
    cfgActiveNav = btn.dataset.target;
    document.querySelectorAll('#config-nav [data-target]')
      .forEach((b) => b.classList.toggle('current', b === btn));
    if (cfgActiveNav === 'top') {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    const group = CFG_GROUPS.find((g) => g.id === cfgActiveNav);
    if (group && group.advanced && !cfgAdvancedOpen) {
      cfgAdvancedOpen = true;
      await renderConfig(true);
    }
    document.getElementById(`cfg-group-${cfgActiveNav}`)
      ?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  // 搜索：输入停顿后再重绘，减少连续请求
  let cfgSearchTimer = null;
  $('#config-search').addEventListener('input', (e) => {
    const value = e.target.value.trim().toLowerCase();
    clearTimeout(cfgSearchTimer);
    cfgSearchTimer = setTimeout(() => {
      cfgQuery = value;
      renderConfig(true).catch(() => {});
    }, 180);
  });

  // 类型筛选：全部 / 即时生效 / 需重启 / 开关项
  $('#config-filters').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-filter]');
    if (!btn) return;
    cfgFilter = btn.dataset.filter;
    document.querySelectorAll('#config-filters .chip')
      .forEach((b) => b.classList.toggle('current', b === btn));
    renderConfig(true).catch(() => {});
  });

  // 空状态里的清空按钮：同时复位搜索词与筛选
  $('#config-clear').addEventListener('click', () => {
    cfgQuery = '';
    cfgFilter = 'all';
    $('#config-search').value = '';
    document.querySelectorAll('#config-filters .chip')
      .forEach((b) => b.classList.toggle('current', b.dataset.filter === 'all'));
    renderConfig(true).catch(() => {});
  });

  async function refreshAll() {
    // 单个区块失败不拖垮整页刷新；只刷新当前可见页签的区块
    const jobs = TAB_RENDERERS[currentTab] || [];
    for (const job of jobs) {
      try { await job(); } catch (_) { /* 等下一轮轮询重试 */ }
    }
  }

  // ---------- 日志工具栏 ----------

  // 行数切换：换一档行数后强制重新拉取（清掉指纹，避免被认为是同一批数据）
  $('#log-lines').addEventListener('change', (e) => {
    logLines = Number(e.target.value) || 200;
    lastLogsSig = '';
    renderLogs(true).catch(() => {});
  });

  // 关键字过滤：只过滤本地缓存，不重新请求；输入停顿后再重绘
  let logFilterTimer = null;
  $('#log-filter').addEventListener('input', (e) => {
    const value = e.target.value.trim().toLowerCase();
    clearTimeout(logFilterTimer);
    logFilterTimer = setTimeout(() => {
      logKeyword = value;
      renderLogView();
    }, 150);
  });

  // 自动刷新开关：暂停后轮询不再重绘，方便停在某一段慢慢看
  $('#log-auto').addEventListener('click', () => {
    logAuto = !logAuto;
    const btn = $('#log-auto');
    btn.classList.toggle('current', logAuto);
    btn.textContent = logAuto ? t('自动刷新', 'Auto refresh') : t('已暂停', 'Paused');
    if (logAuto) {
      lastLogsSig = '';
      renderLogs(true).catch(() => {});
    }
  });

  // 复制：把当前过滤后可见的日志行写入剪贴板
  $('#log-copy').addEventListener('click', async () => {
    const kw = logKeyword;
    const rows = kw
      ? logRaw.filter((line) => line.toLowerCase().includes(kw))
      : logRaw;
    if (!rows.length) { toast(t('没有可复制的日志', 'No logs to copy')); return; }
    try {
      await navigator.clipboard.writeText(rows.join('\n'));
      toast(t(`已复制 ${rows.length} 行日志`, `Copied ${rows.length} log lines`));
    } catch (_) {
      toast(t('复制失败，请手动选中日志内容', 'Copy failed; select the log text manually'));
    }
  });

  // 手动刷新：忽略暂停状态，强制拉取最新日志
  $('#log-refresh').addEventListener('click', () => renderLogs(true).catch(() => {}));

  // ---------- 启动 ----------

  // 本机还没选过语言时跟随服务端 LANGUAGE：切换结果已写回 .env，重启后沿用上次选择
  try {
    const st = await getStatus();
    const before = getLang();
    if (initLang(st.language) !== before) {
      updateLangBtn();
      applyI18n();
      renderPageTitle();
      setBadge(badgeState);
      lastStatusSig = lastAgentsSig = lastTasksSig = lastLogsSig = lastConfigSig = '';
    }
  } catch (_) { /* 服务未启动：保持默认中文，交给三态探测提示 */ }

  await handleState();
  // 在线时每 5 秒轮询一次整体状态（接口不通则重新走三态探测）
  setInterval(async () => {
    if (overlay.classList.contains('hidden')) {
      try {
        await getStatus();
        await refreshAll();
      } catch (_) {
        await handleState();
      }
    }
  }, 5000);
</script>

</body>
</html>
