<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理台 - IM-Agent Gateway 控制台</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

<header class="topbar">
  <div class="logo">IM-Agent Gateway 控制台</div>
  <nav>
    <a href="index.html" class="current">管理台</a>
    <a href="chat.html">聊天台</a>
  </nav>
  <div class="spacer"></div>
  <span id="state-badge" class="badge hidden">检测中</span>
</header>

<!-- 睡眠 / 离线遮罩面板 -->
<div id="overlay" class="overlay hidden">
  <div class="panel">
    <h1 id="overlay-title">服务正在休息</h1>
    <p id="overlay-text">服务暂时没有在运行，你可以把它叫醒。</p>
    <button id="wake-btn" class="btn big">点击唤醒</button>
    <p id="overlay-tip" class="hidden" style="margin-top:18px; margin-bottom:0;">正在尝试叫醒服务，请稍等…</p>
  </div>
</div>

<main class="main">

  <!-- 运行状态 -->
  <section class="card">
    <h2>运行状态</h2>
    <div id="status-body" class="kv">
      <span class="k">正在获取…</span>
    </div>
  </section>

  <!-- Agent 服务开关 -->
  <section class="card">
    <h2>智能体服务 <span id="agent-count" class="count"></span></h2>
    <div id="agent-list"></div>
  </section>

  <!-- 任务 -->
  <section class="card">
    <h2>任务 <span id="task-count" class="count"></span></h2>
    <div id="task-list" class="task-list"><div>正在获取…</div></div>
  </section>

  <!-- 日志 -->
  <section class="card">
    <h2>
      运行日志
      <span class="spacer" style="flex:1"></span>
      <button id="log-refresh" class="btn ghost">刷新</button>
    </h2>
    <pre id="log-body" class="log-pre">还没有日志内容</pre>
  </section>

  <!-- 配置：常用直接展示，高级项收进折叠区，未登记项只读展示 -->
  <section class="card">
    <h2>配置</h2>
    <div id="config-common"></div>
    <details id="config-advanced-box" class="hidden">
      <summary>高级设置（一般不用改）</summary>
      <div id="config-advanced"></div>
    </details>
    <details id="config-unknown-box" class="hidden">
      <summary>未登记配置（只读）</summary>
      <div id="config-unknown"></div>
    </details>
  </section>

</main>

<!-- 保存成功提示（全局 toast） -->
<div id="toast" class="toast hidden"></div>

<script type="module">
  // 管理台页面逻辑：三态探测（在线 / 睡眠 / 离线）+ 各区块渲染 + 轮询刷新
  import {
    detectState, getStatus, getAgents, setAgentActive,
    getTasks, getLogs, getConfig, setConfig, wakeService,
  } from './js/api.js';

  const $ = (sel) => document.querySelector(sel);

  const stateBadge = $('#state-badge');
  const overlay = $('#overlay');
  const overlayTitle = $('#overlay-title');
  const overlayText = $('#overlay-text');
  const wakeBtn = $('#wake-btn');
  const overlayTip = $('#overlay-tip');

  // ---------- 三态控制 ----------

  function setBadge(state) {
    stateBadge.classList.remove('hidden', 'offline', 'sleep');
    if (state === 'online') {
      stateBadge.textContent = '运行中';
    } else if (state === 'sleeping') {
      stateBadge.textContent = '睡眠中';
      stateBadge.classList.add('sleep');
    } else if (state === 'offline') {
      stateBadge.textContent = '未运行';
      stateBadge.classList.add('offline');
    } else {
      stateBadge.textContent = state; // 提示文案等其他状态
    }
  }

  function showSleeping() {
    setBadge('sleeping');
    overlayTitle.textContent = '服务正在休息';
    overlayText.textContent = '服务暂时没有在运行，你可以把它叫醒。';
    wakeBtn.classList.remove('hidden');
    overlayTip.classList.add('hidden');
    overlay.classList.remove('hidden');
  }

  function showOffline() {
    setBadge('offline');
    overlayTitle.textContent = '服务没有启动';
    overlayText.textContent = '既没有查到运行中的服务，也没有找到值守的看门狗。请先在电脑上启动服务，再刷新本页。';
    wakeBtn.classList.add('hidden');
    overlay.classList.remove('hidden');
  }

  async function handleState() {
    const state = await detectState();
    if (state === 'online') {
      overlay.classList.add('hidden');
      setBadge('运行中');
      await refreshAll();
    } else if (state === 'sleeping') {
      showSleeping();
    } else {
      showOffline();
    }
  }

  // 唤醒：点击后打 /api/wake，随后轮询等服务上线（最多 60 秒）
  wakeBtn.addEventListener('click', async () => {
    wakeBtn.disabled = true;
    wakeBtn.textContent = '正在叫醒…';
    overlayTip.classList.remove('hidden');
    try {
      await wakeService();
    } catch (_) { /* 看门狗可能在服务接管端口瞬间断开，继续轮询即可 */ }
    const deadline = Date.now() + 60 * 1000;
    const poll = setInterval(async () => {
      try {
        await getStatus();
        clearInterval(poll);
        wakeBtn.disabled = false;
        wakeBtn.textContent = '点击唤醒';
        await handleState();
      } catch (_) {
        if (Date.now() > deadline) {
          clearInterval(poll);
          wakeBtn.disabled = false;
          wakeBtn.textContent = '点击唤醒';
          overlayText.textContent = '叫醒服务超过了 60 秒还没成功，请到电脑上检查服务进程。';
        }
      }
    }, 1500);
  });

  // ---------- 区块渲染 ----------

  function fmtIdle(row) {
    const idle = row.idle;
    if (!idle || !idle.exit_enabled) {
      return '';
    }
    const remain = Math.max(0, idle.idle_min * 60 - idle.idle_sec);
    const min = Math.floor(remain / 60);
    if (min >= 1) {
      return `<span class="k">休息倒计时</span><span>大约 ${min} 分钟后自动休息</span>`;
    }
    return `<span class="k">休息倒计时</span><span>即将自动休息（收到新消息会重新计时）</span>`;
  }

  async function renderStatus() {
    const st = await getStatus();
    const channels = st.channels.map((c) =>
      `${c.name}（${c.connected ? '已连接' : '未连接'}）`).join('、') || '无';
    $('#status-body').innerHTML = [
      '<span class="k">运行状态</span><span>正常运行</span>',
      `<span class="k">消息通道</span><span>${channels}</span>`,
      `<span class="k">智能体</span><span>共 ${st.agents.total} 个，已开启 ${st.agents.active} 个</span>`,
      fmtIdle(st),
    ].filter(Boolean).join('');
  }

  async function renderAgents() {
    const agents = await getAgents();
    $('#agent-count').textContent = `${agents.filter((a) => a.active).length} / ${agents.length} 已开启`;
    const host = $('#agent-list');
    host.innerHTML = '';
    if (!agents.length) {
      host.innerHTML = '<div class="agent-row"><div class="desc">还没有接入任何智能体</div></div>';
      return;
    }
    // 用途与档位的通俗展示名（与后端 kind / complexity 配置对应）
    const KIND_CN = { chat: '对话', coding: '编码', office: '办公' };
    const LEVEL_CN = { simple: '简单', mid: '中等', complex: '复杂' };
    agents.forEach((a) => {
      const row = document.createElement('div');
      row.className = 'agent-row';
      const disabled = a.active && !a.available;
      const levelText = a.complexity ? `，档位：${LEVEL_CN[a.complexity] || a.complexity}` : '';
      row.innerHTML = `
        <div class="info">
          <div class="name">${a.label}</div>
          <div class="desc">${a.routing_hint}</div>
          <div class="desc">用途：${KIND_CN[a.kind] || a.kind || '未设置'}${levelText}</div>
          ${!a.available ? '<div class="state-note">暂不可用：缺少配置或未安装</div>' : ''}
        </div>
        <button class="toggle ${a.active ? 'on' : ''}" ${disabled ? 'disabled' : ''}
                title="${a.active ? '点击关闭' : '点击开启'}">
          <span class="knob"></span>
        </button>`;
      const toggle = row.querySelector('.toggle');
      toggle.addEventListener('click', async () => {
        toggle.disabled = true;
        try {
          const res = await setAgentActive(a.name, !a.active);
          if (!res.ok) {
            alert(res.error || '操作没有成功，请稍后再试');
          }
          await renderAgents();
          await renderStatus();
        } catch (_) {
          alert('连接服务失败，请稍后再试');
          toggle.disabled = false;
        }
      });
      host.appendChild(row);
    });
  }

  async function renderTasks() {
    const data = await getTasks();
    $('#task-count').textContent = `${data.inflight} 个进行中`;
    const host = $('#task-list');
    if (!data.recent.length) {
      host.innerHTML = '<div>最近没有任务记录</div>';
      return;
    }
    host.innerHTML = data.recent.map((t) => `
      <div class="task-item">
        <span class="${t.ok ? 'ok' : 'fail'}">${t.ok ? '完成' : '失败'}</span>
        <span>${t.label}</span>
        <span>来源：${t.im}</span>
        ${t.model ? `<span>模型：${t.model}</span>` : ''}
        <span>用时：${t.elapsed_sec} 秒</span>
        ${t.usage ? `<span>${t.usage}</span>` : ''}
      </div>`).join('');
  }

  async function renderLogs() {
    const data = await getLogs(200);
    $('#log-body').textContent = data.lines.join('\n') || '还没有日志内容';
  }

  // ---------- 配置区（常用平铺 + 高级折叠 + 行内编辑） ----------

  // 正在行内编辑的配置键：编辑中暂停本区块轮询重建，防止输入框被刷掉
  let cfgEditKey = null;
  // 已保存待重启的新值（键 → 值）：轮询刷新时保持显示新值并带「待重启」角标
  const cfgPending = new Map();

  // 插值统一转义，配置值里出现的 HTML 字符不进标签层
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));

  // 全局 toast：保存成功等轻提示，几秒后自动消失
  let toastTimer = null;
  function toast(msg) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.remove('hidden');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.add('hidden'), 3200);
  }

  // 某项当前展示值：优先显示本会话已保存的新值，否则用后端返回的当前运行值
  const cfgShown = (it) => (cfgPending.has(it.key) ? cfgPending.get(it.key) : it.value);

  // 渲染单条配置行；editable=false 为未登记只读行（没有修改入口）
  function cfgRow(it, editable) {
    const row = document.createElement('div');
    row.className = 'cfg-row';
    const shown = cfgShown(it);
    const pend = cfgPending.has(it.key);
    const pendTag = pend ? '<span class="pend-badge">待重启</span>' : '';
    if (editable && it.type === 'bool') {
      // 开关项：与智能体开关同款滑块，点击即保存（值写 1 / 0）
      row.innerHTML = `
        <div class="info">
          <div class="name">${esc(it.label)} ${pendTag}</div>
          <div class="desc">${esc(it.desc)}</div>
        </div>
        <button class="toggle ${shown === '1' ? 'on' : ''}"
                title="${shown === '1' ? '点击关闭' : '点击开启'}"><span class="knob"></span></button>`;
      row.querySelector('.toggle').addEventListener('click', async (e) => {
        const btn = e.currentTarget;
        btn.disabled = true;
        const next = shown === '1' ? '0' : '1';
        try {
          const res = await setConfig(it.key, next);
          if (res.ok) {
            cfgPending.set(it.key, next);
            toast('已保存，重启服务后生效');
          } else {
            alert(res.error || '保存没有成功，请稍后再试');
          }
        } catch (_) {
          alert('连接服务失败，请稍后再试');
        }
        btn.disabled = false;
        // 保存后立即重渲染反映新状态，不等下一轮轮询
        renderConfig().catch(() => {});
      });
      return row;
    }
    // 文本项：当前值 + 修改按钮（只读行只展示值）
    row.innerHTML = `
      <div class="info">
        <div class="name">${esc(it.label)} ${pendTag}</div>
        <div class="desc">${esc(it.desc)}</div>
      </div>
      <div class="value" title="${esc(shown)}">${esc(shown)}</div>
      ${editable ? '<button class="btn ghost small">修改</button>' : ''}`;
    if (editable) {
      row.querySelector('.btn').addEventListener('click', () => cfgStartEdit(row, it));
    }
    return row;
  }

  // 点「修改」：该行的值区域就地变成 输入框 + 保存 / 取消
  function cfgStartEdit(row, it) {
    cfgEditKey = it.key;
    const shown = cfgShown(it);
    const editBtn = row.querySelector('.btn'); // 行尾的「修改」按钮，稍后移除
    const box = document.createElement('div');
    box.className = 'cfg-edit';
    // 敏感项不在输入框里回填 ******（避免误当成真实值提交）：留空保存 = 保持不变
    box.innerHTML = `
      <input type="text" placeholder="${it.sensitive ? '留空保持不变，填写新值则更换' : esc(shown)}">
      <button class="btn small">保存</button>
      <button class="btn ghost small">取消</button>`;
    row.querySelector('.value').replaceWith(box);
    editBtn.remove();
    const input = box.querySelector('input');
    input.focus();
    // 结束编辑：恢复该区块渲染（cfgEditKey 复位后轮询也恢复正常）
    const done = () => { cfgEditKey = null; renderConfig().catch(() => {}); };
    box.querySelector('.btn:not(.ghost)').addEventListener('click', async () => {
      const value = input.value.trim();
      if (it.sensitive && !value) { done(); return; } // 敏感项留空 = 不修改
      try {
        const res = await setConfig(it.key, value);
        if (!res.ok) {
          // 保存失败：提示错误并保持编辑框打开，方便改了再存
          alert(res.error || '保存没有成功，请稍后再试');
          input.focus();
          return;
        }
        cfgPending.set(it.key, value);
        toast('已保存，重启服务后生效');
      } catch (_) {
        alert('连接服务失败，请稍后再试');
        input.focus();
        return;
      }
      done();
    });
    box.querySelector('.btn.ghost').addEventListener('click', done);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') box.querySelector('.btn:not(.ghost)').click();
      if (e.key === 'Escape') done();
    });
  }

  async function renderConfig() {
    // 正在编辑时不重建列表，防止输入框与已输入内容被轮询刷掉
    if (cfgEditKey !== null) { return; }
    const cfg = await getConfig();
    const commonHost = $('#config-common');
    commonHost.innerHTML = '';
    cfg.common.forEach((it) => commonHost.appendChild(cfgRow(it, true)));
    const advBox = $('#config-advanced-box');
    advBox.classList.toggle('hidden', !cfg.advanced.length);
    const advHost = $('#config-advanced');
    advHost.innerHTML = '';
    cfg.advanced.forEach((it) => advHost.appendChild(cfgRow(it, true)));
    const unkBox = $('#config-unknown-box');
    unkBox.classList.toggle('hidden', !cfg.unknown.length);
    const unkHost = $('#config-unknown');
    unkHost.innerHTML = '';
    cfg.unknown.forEach((it) => unkHost.appendChild(cfgRow(it, false)));
  }

  async function refreshAll() {
    // 单个区块失败不拖垮整页刷新
    const jobs = [renderStatus, renderAgents, renderTasks, renderLogs, renderConfig];
    for (const job of jobs) {
      try { await job(); } catch (_) { /* 等下一轮轮询重试 */ }
    }
  }

  $('#log-refresh').addEventListener('click', () => renderLogs().catch(() => {}));

  // ---------- 启动 ----------

  await handleState();
  // 在线时每 5 秒轮询一次整体状态（接口不通则重新走三态探测）
  setInterval(async () => {
    if (overlay.classList.contains('hidden')) {
      try {
        await getStatus();
        await refreshAll();
      } catch (_) {
        await handleState();
      }
    }
  }, 5000);
</script>

</body>
</html>
